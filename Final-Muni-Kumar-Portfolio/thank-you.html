<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b27">
  <title>Message received | K Muni Kumar</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .thank-you-wrap{min-height:100vh;display:grid;place-items:center;padding:32px 6%;background:#f5f3ee}
    .thank-you-card{width:min(100%,680px);padding:clamp(32px,6vw,64px);background:#fff;border:1px solid #e6e3dc}
    .thank-you-card h1{font-size:clamp(38px,7vw,64px);line-height:1.05;color:#172b27;margin:14px 0}
    .thank-you-card p{font-size:clamp(18px,2.4vw,22px);line-height:1.7;color:#46564f}
    .thank-you-card a{display:inline-block;margin-top:20px;padding:16px 24px;background:#172b27;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="thank-you-wrap">
    <section class="thank-you-card">
      <p style="font:12px monospace;letter-spacing:.16em;text-transform:uppercase;color:#c76b4d">MESSAGE RECEIVED</p>
      <h1>Thank you for reaching out.</h1>
      <p>Your message has been submitted successfully. I appreciate you getting in touch and will respond as soon as I can.</p>
      <a href="/#home">Back to portfolio ↗</a>
    </section>
  </main>
</body>
</html>
